name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Тесты
        run: dotnet test --solution Offload.slnx -c Release

      - name: Установка Inno Setup
        shell: pwsh
        run: |
          $found = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 7\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $found) { choco install innosetup -y --no-progress }

      - name: Публикация и установщик
        shell: pwsh
        run: .\scripts\build.ps1 -SkipTests -Installer

      - uses: actions/upload-artifact@v4
        with:
          name: Offload
          path: |
            publish/Offload.exe
            dist/*.exe

      - name: Контрольные суммы
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Get-Item dist/*.exe, publish/Offload.exe |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Encoding ascii publish/SHA256SUMS.txt

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Offload ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            dist/*.exe
            publish/Offload.exe
            publish/SHA256SUMS.txt
