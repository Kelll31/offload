name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# По умолчанию — только чтение; права на запись получает лишь job релиза.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # Та же версия, что #define InnoSetupVersion в installer/Offload.iss (скрипт откажется собираться другой).
  INNO_SETUP_VERSION: "7.1.0"
  INNO_SETUP_SHA256: "0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f"

jobs:
  build:
    runs-on: windows-latest
    # Сборки веток и PR секретов подписи не видят: секреты — только в окружении «release» (job ниже, только теги).
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Версия совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = $env:TAG.TrimStart('v')
          if ($version -ne $tag) { throw "Тег v$tag не совпадает с <Version>$version</Version> в Directory.Build.props" }

      - name: Тесты
        run: dotnet test --solution Offload.slnx -c Release

      - name: Установка Inno Setup
        shell: pwsh
        run: |
          # Закреплённая версия с официального релиза jrsoftware/issrc и проверкой SHA-256 — не предустановленная в образе.
          $v = $env:INNO_SETUP_VERSION
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-$($v.Replace('.', '_'))/innosetup-$v-x64.exe"
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$v.exe"
          Invoke-WebRequest -Uri $url -OutFile $setup
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($sha -ne $env:INNO_SETUP_SHA256) { throw "SHA-256 установщика Inno Setup не совпал: $sha" }
          $dir = Join-Path $env:RUNNER_TEMP "inno-setup-$v"
          $p = Start-Process $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/DIR=`"$dir`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Установка Inno Setup: код $($p.ExitCode)" }
          $iscc = Join-Path $dir "ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Не найден $iscc" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Публикация и установщик
        shell: pwsh
        env:
          # Пусты вне окружения «release»; подпись включается, только если сертификат задан (см. scripts/build.ps1 -Sign).
          OFFLOAD_SIGN_PFX_BASE64: ${{ secrets.OFFLOAD_SIGN_PFX_BASE64 }}
          OFFLOAD_SIGN_PFX_PASSWORD: ${{ secrets.OFFLOAD_SIGN_PFX_PASSWORD }}
        run: |
          $sign = [bool]$env:OFFLOAD_SIGN_PFX_BASE64 -and $env:GITHUB_REF.StartsWith("refs/tags/v")
          if ($sign) { .\scripts\build.ps1 -SkipTests -Installer -Sign } else { .\scripts\build.ps1 -SkipTests -Installer }

      - name: Дымовая проверка MCP (опубликованный exe)
        shell: pwsh
        run: |
          $env:OFFLOAD_HOME = Join-Path $env:RUNNER_TEMP "offload-home"
          New-Item -ItemType Directory -Force $env:OFFLOAD_HOME | Out-Null
          node scripts/mcp-smoke.mjs --strict publish/Offload.exe
          if ($LASTEXITCODE -ne 0) { throw "MCP-сервер нарушил протокол (см. вывод выше)" }

      # SBOM по восстановленным пакетам (obj/project.assets.json). Не блокирует сборку, пока шаг не проверен на практике.
      - name: SBOM
        continue-on-error: true
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: publish/offload-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Offload
          path: |
            publish/Offload.exe
            publish/offload-sbom.spdx.json
            dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Offload
          path: artifacts

      - name: Контрольные суммы
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Recurse -Filter *.exe |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Encoding ascii artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt

      - name: Подтверждение происхождения сборки
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/**/*.exe

      - name: Релиз
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Offload ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            artifacts/**/*.exe
            artifacts/**/offload-sbom.spdx.json
            artifacts/SHA256SUMS.txt
