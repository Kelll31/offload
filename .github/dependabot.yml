version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      xunit:
        patterns: ["xunit*", "Microsoft.Testing.*"]
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
